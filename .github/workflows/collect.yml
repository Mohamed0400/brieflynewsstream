name: Collect news

# Full pipeline: pre-heal → collect → translate → confirm.
# EGRESS GUARD (Free ~5GB): main collect is throttled hard so Arabic can stay online.
# Kill switch: MAIN_COLLECT_ENABLED=false (pause main FIRST under quota pressure).
# Arabic desk: collect-arabic.yml — higher priority, keep enabled.

on:
  schedule:
    # Once daily Asia/Kuwait (UTC+3): 6:00 AM only (was 5×/day — burned Free egress).
    - cron: "0 3 * * *"
  workflow_dispatch:

concurrency:
  group: collect-news
  cancel-in-progress: false

env:
  APP_TIMEZONE: Asia/Kuwait
  NEXT_PUBLIC_APP_ENV: live
  # Pause main collect without touching Arabic: set secret/env MAIN_COLLECT_ENABLED=false
  MAIN_COLLECT_ENABLED: ${{ vars.MAIN_COLLECT_ENABLED || 'true' }}
  GOOGLE_GROUNDED_SEARCH_ENABLED: "false"
  GOOGLE_EDITORIAL_ENABLED: "false"
  MIN_COUNTRY_ARTICLES: "2"
  # Harder caps than Arabic — main catalog is ~3× larger.
  COLLECT_CONCURRENCY: "2"
  COLLECT_BUDGET_MS: "1800000"
  COLLECT_GNEWS_LIMIT: "5"
  # Longer backoff; still force once/day so the single scheduled run refreshes.
  COLLECT_REFRESH_HOURS: "12"
  CRON_FORCE_COLLECT: "true"
  NORMALIZE_BATCH_SIZE: "1500"
  NORMALIZE_PASSES: "6"
  NORMALIZE_PRE_COLLECT_PASSES: "1"
  TRANSLATE_BATCH_SIZE: "60"
  TRANSLATE_MAX_PASSES: "25"
  TRANSLATE_CONCURRENCY: "2"
  DATABASE_URL: ${{ secrets.DATABASE_URL }}
  DIRECT_URL: ${{ secrets.DIRECT_URL }}
  GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
  ADMIN_API_KEY: ${{ secrets.ADMIN_API_KEY }}
  CRON_SECRET: ${{ secrets.CRON_SECRET }}
  SITE_URL: ${{ secrets.SITE_URL }}
  PRISMA_CONNECTION_LIMIT: "4"

jobs:
  gate:
    name: Egress gate (MAIN_COLLECT_ENABLED)
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.check.outputs.enabled }}
    steps:
      - id: check
        run: |
          flag="${MAIN_COLLECT_ENABLED:-true}"
          echo "MAIN_COLLECT_ENABLED=$flag"
          if [ "$flag" = "false" ] || [ "$flag" = "0" ] || [ "$flag" = "off" ]; then
            echo "::warning::Main collect paused (MAIN_COLLECT_ENABLED=$flag). Arabic collect is unaffected."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            {
              echo "## Main collect paused"
              echo "Set repo variable \`MAIN_COLLECT_ENABLED=true\` to resume."
              echo "Keep Arabic collect running — it is the priority desk."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

  pre-heal:
    name: Pre-heal (stop stuck translate, clear locks)
    needs: gate
    if: needs.gate.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Check secrets
        run: |
          if [ -z "$DATABASE_URL" ] && [ -z "$CRON_SECRET" ] && [ -z "$ADMIN_API_KEY" ]; then
            echo "::error::Need DATABASE_URL (+ DIRECT_URL) or CRON_SECRET/ADMIN_API_KEY."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/ci?schema=public
          DIRECT_URL: postgresql://postgres:postgres@127.0.0.1:5432/ci?schema=public
        run: npx prisma generate

      - name: Pre-heal via database
        if: ${{ env.DATABASE_URL != '' }}
        run: |
          set -o pipefail
          npx tsx src/worker/ops-heal-once.ts --pre-collect | tee pre-heal-result.json
          {
            echo "## Pre-heal"
            echo '```json'
            cat pre-heal-result.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Pre-heal via HTTP ops-heal
        if: ${{ env.DATABASE_URL == '' }}
        run: |
          token="${CRON_SECRET:-$ADMIN_API_KEY}"
          base="${SITE_URL:-https://www.brieflynewsstream.com}"
          curl -fsS -X POST "$base/api/cron/ops-heal" \
            -H "Authorization: Bearer $token" \
            -H "Content-Type: application/json" \
            --max-time 300 | tee pre-heal-result.json
          {
            echo "## Pre-heal (HTTP)"
            echo '```json'
            cat pre-heal-result.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  collect:
    name: Collect all countries
    needs: [gate, pre-heal]
    if: needs.gate.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/ci?schema=public
          DIRECT_URL: postgresql://postgres:postgres@127.0.0.1:5432/ci?schema=public
        run: npx prisma generate

      - name: Collect via database pipeline
        id: pipeline
        run: |
          set -o pipefail
          if [ -z "$DATABASE_URL" ]; then
            echo "No DATABASE_URL secret; will try HTTP collect."
            echo "used_http=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          {
            echo "## Why this job is long-running"
            echo ""
            echo "Main collect is **egress-throttled** (1×/day, concurrency 2, GNews ≤5)."
            echo "Arabic desk runs separately and is the priority under Free-plan limits."
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"
          npx tsx src/worker/run-once.ts --force | tee pipeline-result.json
          echo "used_http=false" >> "$GITHUB_OUTPUT"
          {
            echo "## Collect pipeline result"
            echo '```json'
            cat pipeline-result.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Collect via cron HTTP
        if: steps.pipeline.outputs.used_http == 'true'
        run: |
          token="${CRON_SECRET:-$ADMIN_API_KEY}"
          base="${SITE_URL:-https://www.brieflynewsstream.com}"
          if ! response=$(curl -fsS -X POST "$base/api/cron/collect" \
            -H "Authorization: Bearer $token" \
            -H "Content-Type: application/json" \
            --max-time 300); then
            echo "::error::HTTP collect against $base/api/cron/collect failed."
            exit 1
          fi
          echo "$response"
          {
            echo "## Collect HTTP result"
            echo '```json'
            echo "$response"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  translate:
    name: Translate after collect
    needs: [gate, collect]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    if: always() && needs.gate.outputs.enabled == 'true' && needs.collect.result != 'cancelled'
    env:
      TRANSLATE_MAX_PASSES: "25"
      TRANSLATE_BATCH_SIZE: "60"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/ci?schema=public
          DIRECT_URL: postgresql://postgres:postgres@127.0.0.1:5432/ci?schema=public
        run: npx prisma generate

      - name: Translate via scheduled job
        if: ${{ env.DATABASE_URL != '' }}
        run: |
          set -o pipefail
          if [ -z "$GOOGLE_API_KEY" ]; then
            echo "::warning::GOOGLE_API_KEY missing; translate job will not fill ar/en pairs."
          fi
          npx tsx src/worker/job-once.ts translate --force | tee translate-result.json
          {
            echo "## Translate after collect"
            echo '```json'
            cat translate-result.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Translate via HTTP
        if: ${{ env.DATABASE_URL == '' }}
        run: |
          token="${CRON_SECRET:-$ADMIN_API_KEY}"
          base="${SITE_URL:-https://www.brieflynewsstream.com}"
          curl -fsS -X POST "$base/api/cron/translate" \
            -H "Authorization: Bearer $token" \
            -H "Content-Type: application/json" \
            --max-time 300 | tee translate-result.json
          {
            echo "## Translate after collect (HTTP)"
            echo '```json'
            cat translate-result.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  confirm:
    name: Confirm fresh bilingual feed
    needs: [gate, collect, translate]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    if: always() && needs.gate.outputs.enabled == 'true' && needs.collect.result != 'cancelled'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/ci?schema=public
          DIRECT_URL: postgresql://postgres:postgres@127.0.0.1:5432/ci?schema=public
        run: npx prisma generate

      - name: Confirm freshness + translation (repair if needed)
        if: ${{ env.DATABASE_URL != '' }}
        env:
          TRANSLATE_BATCH_SIZE: "60"
          TRANSLATE_MAX_PASSES: "30"
          TRANSLATE_CONCURRENCY: "2"
        run: |
          set -o pipefail
          npx tsx scripts/ops-confirm-once.ts \
            --max-age-hours=24 \
            --max-pending-translate=600 \
            --repair | tee confirm-result.json
          {
            echo "## Confirm"
            echo '```json'
            cat confirm-result.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Smoke-check production health
        env:
          BASE_URL: ${{ secrets.SITE_URL || 'https://www.brieflynewsstream.com' }}
        run: |
          npx tsx scripts/smoke-bilingual.ts \
            || echo "::warning::Production smoke check reported problems; see the step log."
