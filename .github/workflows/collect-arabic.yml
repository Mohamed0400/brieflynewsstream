name: Collect Arabic news

# Separate Arabic-only pipeline — no Gemini translation.
# Kill switch: set ARABIC_COLLECT_ENABLED=false in repo secrets or skip workflow.

on:
  schedule:
    # Five times daily Asia/Kuwait (UTC+3): 8 AM, 12 PM, 4 PM, 8 PM, 12 AM
    - cron: "0 5 * * *"
    - cron: "0 9 * * *"
    - cron: "0 13 * * *"
    - cron: "0 17 * * *"
    - cron: "0 21 * * *"
  workflow_dispatch:

concurrency:
  group: collect-arabic-news
  cancel-in-progress: false

env:
  APP_TIMEZONE: Asia/Kuwait
  NEXT_PUBLIC_APP_ENV: live
  ARABIC_COLLECT_ENABLED: "true"
  ARABIC_COLLECT_FORCE: "true"
  ARABIC_COLLECT_CONCURRENCY: "6"
  ARABIC_COLLECT_BUDGET_MS: "1200000"
  ARABIC_COLLECT_REFRESH_HOURS: "2"
  COLLECT_GNEWS_LIMIT: "15"
  NORMALIZE_BATCH_SIZE: "1500"
  NORMALIZE_PASSES: "6"
  DATABASE_URL: ${{ secrets.DATABASE_URL }}
  DIRECT_URL: ${{ secrets.DIRECT_URL }}
  ADMIN_API_KEY: ${{ secrets.ADMIN_API_KEY }}
  CRON_SECRET: ${{ secrets.CRON_SECRET }}
  SITE_URL: ${{ secrets.SITE_URL }}
  PRISMA_CONNECTION_LIMIT: "6"

jobs:
  collect-arabic:
    name: Collect Arabic desk sources
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Check secrets
        run: |
          if [ -z "$DATABASE_URL" ] && [ -z "$CRON_SECRET" ] && [ -z "$ADMIN_API_KEY" ]; then
            echo "::error::Need DATABASE_URL (+ DIRECT_URL) or CRON_SECRET/ADMIN_API_KEY."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/ci?schema=public
          DIRECT_URL: postgresql://postgres:postgres@127.0.0.1:5432/ci?schema=public
        run: npx prisma generate

      - name: Collect Arabic via database pipeline
        if: ${{ env.DATABASE_URL != '' }}
        run: |
          set -o pipefail
          npx tsx src/worker/run-once-arabic.ts --force | tee arabic-collect-result.json
          {
            echo "## Arabic collect"
            echo '```json'
            cat arabic-collect-result.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Collect Arabic via HTTP cron
        if: ${{ env.DATABASE_URL == '' }}
        run: |
          token="${CRON_SECRET:-$ADMIN_API_KEY}"
          base="${SITE_URL:-https://www.brieflynewsstream.com}"
          curl -fsS -X POST "$base/api/cron/collect-arabic" \
            -H "Authorization: Bearer $token" \
            -H "Content-Type: application/json" \
            --max-time 300 | tee arabic-collect-result.json
