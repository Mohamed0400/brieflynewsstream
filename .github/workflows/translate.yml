name: Translate news

# Standalone bilingual backfill between full collects.
# Skips itself while collect holds a live lock (collect workflow re-runs translate after).

on:
  schedule:
    # Between collect slots — Asia/Kuwait: 08:00, 12:00, 16:00, 20:00
    - cron: "0 5 * * *"
    - cron: "0 9 * * *"
    - cron: "0 13 * * *"
    - cron: "0 17 * * *"
  workflow_dispatch:

concurrency:
  group: translate-news
  cancel-in-progress: false

env:
  APP_TIMEZONE: Asia/Kuwait
  NEXT_PUBLIC_APP_ENV: live
  DATABASE_URL: ${{ secrets.DATABASE_URL }}
  DIRECT_URL: ${{ secrets.DIRECT_URL }}
  GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
  ADMIN_API_KEY: ${{ secrets.ADMIN_API_KEY }}
  CRON_SECRET: ${{ secrets.CRON_SECRET }}
  SITE_URL: ${{ secrets.SITE_URL }}
  PRISMA_CONNECTION_LIMIT: "6"
  TRANSLATE_BATCH_SIZE: "100"
  TRANSLATE_MAX_PASSES: "50"
  TRANSLATE_CONCURRENCY: "4"
  NORMALIZE_BATCH_SIZE: "2500"
  NORMALIZE_BACKLOG_PASSES: "8"

jobs:
  translate:
    name: Drain pending translations
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Check secrets
        run: |
          if [ -z "$DATABASE_URL" ] && [ -z "$CRON_SECRET" ] && [ -z "$ADMIN_API_KEY" ]; then
            echo "::error::Need DATABASE_URL (+ DIRECT_URL) or CRON_SECRET/ADMIN_API_KEY."
            exit 1
          fi
          if [ -n "$DATABASE_URL" ] && [ -z "$GOOGLE_API_KEY" ]; then
            echo "::warning::GOOGLE_API_KEY is not set; translate will not fill missing ar/en pairs."
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/ci?schema=public
          DIRECT_URL: postgresql://postgres:postgres@127.0.0.1:5432/ci?schema=public
        run: npx prisma generate

      - name: Clear zombie translate lock then translate
        if: ${{ env.DATABASE_URL != '' }}
        run: |
          set -o pipefail
          # Heal zombies without force-killing a live collect heartbeat.
          npx tsx src/worker/ops-heal-once.ts --no-translate | tee heal-result.json || true
          # Skip if collect is mid-run; collect.yml always translates afterward.
          npx tsx src/worker/job-once.ts translate --force --skip-if-collect-running \
            | tee translate-result.json
          {
            echo "## Heal"
            echo '```json'
            cat heal-result.json
            echo '```'
            echo "## Translate"
            echo '```json'
            cat translate-result.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Translate via HTTP
        if: ${{ env.DATABASE_URL == '' }}
        run: |
          token="${CRON_SECRET:-$ADMIN_API_KEY}"
          base="${SITE_URL:-https://www.brieflynewsstream.com}"
          curl -fsS -X POST "$base/api/cron/translate" \
            -H "Authorization: Bearer $token" \
            -H "Content-Type: application/json" \
            --max-time 300 | tee translate-result.json
          {
            echo "## Translate (HTTP)"
            echo '```json'
            cat translate-result.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
