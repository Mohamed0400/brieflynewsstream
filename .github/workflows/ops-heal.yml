name: Ops heal

# Clears zombie locks (including collect-arabic) and abandons stale raw between
# full collects so the feed cannot stay blocked until the next Collect run.
# Arabic freshness re-collect belongs to Watchdog Arabic (hourly, soft-heal).

on:
  schedule:
    # Once daily, 9:30 PM Asia/Kuwait, after the evening Arabic collect
    - cron: "30 18 * * *"
  workflow_dispatch:

concurrency:
  group: ops-heal
  cancel-in-progress: false

env:
  APP_TIMEZONE: Asia/Kuwait
  NEXT_PUBLIC_APP_ENV: live
  DATABASE_URL: ${{ secrets.DATABASE_URL }}
  DIRECT_URL: ${{ secrets.DIRECT_URL }}
  GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
  ADMIN_API_KEY: ${{ secrets.ADMIN_API_KEY }}
  CRON_SECRET: ${{ secrets.CRON_SECRET }}
  SITE_URL: ${{ secrets.SITE_URL }}
  PRISMA_CONNECTION_LIMIT: "6"
  TRANSLATE_BATCH_SIZE: "80"
  TRANSLATE_MAX_PASSES: "8"
  TRANSLATE_CONCURRENCY: "4"
  # Neon Free prune-only (R2 usually unset) — see docs/NEON-FREE-LIMITS.md
  ARCHIVE_HOT_RETENTION_DAYS: "3"
  ARCHIVE_RAW_RETENTION_DAYS: "1"
  ARCHIVE_ARTICLE_COUNT_CAP: "20000"
  ARCHIVE_RAW_COUNT_CAP: "25000"
  ARCHIVE_COUNT_CAP_MIN_AGE_HOURS: "36"
  R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
  R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
  R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
  R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}

jobs:
  heal:
    name: Clear locks + abandon stale raw
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Check secrets
        run: |
          if [ -z "$DATABASE_URL" ] && [ -z "$CRON_SECRET" ] && [ -z "$ADMIN_API_KEY" ]; then
            echo "::error::Need DATABASE_URL (+ DIRECT_URL) or CRON_SECRET/ADMIN_API_KEY."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/ci?schema=public
          DIRECT_URL: postgresql://postgres:postgres@127.0.0.1:5432/ci?schema=public
        run: npx prisma generate

      - name: Heal via database
        if: ${{ env.DATABASE_URL != '' }}
        run: |
          set -o pipefail
          # Zombie locks + abandon stale raw only. Never force-kill a live collect heartbeat.
          # Full collect belongs to the Collect news workflow (pre-heal → collect → confirm).
          npx tsx src/worker/ops-heal-once.ts --no-translate | tee heal-result.json
          {
            echo "## Ops heal"
            echo '```json'
            cat heal-result.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Prune hot window (Neon Free backstop)
        if: ${{ env.DATABASE_URL != '' }}
        run: |
          set -o pipefail
          # Age retention + row caps. Without R2 this is prune-only (safe on Free).
          npx tsx src/worker/archive-once.ts | tee prune-result.json
          {
            echo "## Archive / prune"
            echo '```json'
            cat prune-result.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Heal via HTTP
        if: ${{ env.DATABASE_URL == '' }}
        run: |
          token="${CRON_SECRET:-$ADMIN_API_KEY}"
          base="${SITE_URL:-https://www.brieflynewsstream.com}"
          curl -fsS -X POST "$base/api/cron/ops-heal" \
            -H "Authorization: Bearer $token" \
            -H "Content-Type: application/json" \
            --max-time 300 | tee heal-result.json
          {
            echo "## Ops heal (HTTP)"
            echo '```json'
            cat heal-result.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
