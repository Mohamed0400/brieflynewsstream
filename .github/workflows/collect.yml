name: Collect news

# Full pipeline: pre-heal → collect → translate → confirm.
# Pre-heal stops a running/stuck translate so collect can start; translate always
# re-runs after collect. Public repo → standard runners are free; run as needed.

on:
  schedule:
    # Five times daily Asia/Kuwait (UTC+3): 6:00 AM, 10:00 AM, 2:00 PM, 6:00 PM, 10:00 PM
    - cron: "0 3 * * *"
    - cron: "0 7 * * *"
    - cron: "0 11 * * *"
    - cron: "0 15 * * *"
    - cron: "0 19 * * *"
  workflow_dispatch:

concurrency:
  group: collect-news
  cancel-in-progress: false

env:
  APP_TIMEZONE: Asia/Kuwait
  NEXT_PUBLIC_APP_ENV: live
  GOOGLE_GROUNDED_SEARCH_ENABLED: "false"
  GOOGLE_EDITORIAL_ENABLED: "false"
  MIN_COUNTRY_ARTICLES: "3"
  COLLECT_CONCURRENCY: "6"
  COLLECT_BUDGET_MS: "2400000"
  # Short backoff for HTTP backups only. GHA sets CRON_FORCE_COLLECT so every
  # scheduled collect re-hits sources even if the previous run finished recently.
  COLLECT_REFRESH_HOURS: "2"
  CRON_FORCE_COLLECT: "true"
  NORMALIZE_BATCH_SIZE: "2500"
  NORMALIZE_PASSES: "8"
  NORMALIZE_PRE_COLLECT_PASSES: "1"
  TRANSLATE_BATCH_SIZE: "80"
  TRANSLATE_MAX_PASSES: "40"
  TRANSLATE_CONCURRENCY: "4"
  DATABASE_URL: ${{ secrets.DATABASE_URL }}
  DIRECT_URL: ${{ secrets.DIRECT_URL }}
  GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
  ADMIN_API_KEY: ${{ secrets.ADMIN_API_KEY }}
  CRON_SECRET: ${{ secrets.CRON_SECRET }}
  SITE_URL: ${{ secrets.SITE_URL }}
  PRISMA_CONNECTION_LIMIT: "8"

jobs:
  pre-heal:
    name: Pre-heal (stop stuck translate, clear locks)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Check secrets
        run: |
          if [ -z "$DATABASE_URL" ] && [ -z "$CRON_SECRET" ] && [ -z "$ADMIN_API_KEY" ]; then
            echo "::error::Need DATABASE_URL (+ DIRECT_URL) or CRON_SECRET/ADMIN_API_KEY."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/ci?schema=public
          DIRECT_URL: postgresql://postgres:postgres@127.0.0.1:5432/ci?schema=public
        run: npx prisma generate

      - name: Pre-heal via database
        if: ${{ env.DATABASE_URL != '' }}
        run: |
          set -o pipefail
          # Stops running/stuck translate + clears all job locks, abandons stale raw.
          # Translate is restarted in the post-collect job below.
          npx tsx src/worker/ops-heal-once.ts --pre-collect | tee pre-heal-result.json
          {
            echo "## Pre-heal"
            echo '```json'
            cat pre-heal-result.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Pre-heal via HTTP ops-heal
        if: ${{ env.DATABASE_URL == '' }}
        run: |
          token="${CRON_SECRET:-$ADMIN_API_KEY}"
          base="${SITE_URL:-https://www.brieflynewsstream.com}"
          curl -fsS -X POST "$base/api/cron/ops-heal" \
            -H "Authorization: Bearer $token" \
            -H "Content-Type: application/json" \
            --max-time 300 | tee pre-heal-result.json
          {
            echo "## Pre-heal (HTTP)"
            echo '```json'
            cat pre-heal-result.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  collect:
    name: Collect all countries
    needs: pre-heal
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/ci?schema=public
          DIRECT_URL: postgresql://postgres:postgres@127.0.0.1:5432/ci?schema=public
        run: npx prisma generate

      - name: Collect via database pipeline
        id: pipeline
        run: |
          set -o pipefail
          if [ -z "$DATABASE_URL" ]; then
            echo "No DATABASE_URL secret; will try HTTP collect."
            echo "used_http=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          {
            echo "## Why this job is long-running"
            echo ""
            echo "Full collect walks ~70 countries / hundreds of sources, normalizes raw rows, and rebuilds today's edition."
            echo "A dedicated **translate** job runs next to finish ar/en pairs."
            echo "Expect **30–180 minutes**. Do **not** cancel early."
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"
          npx tsx src/worker/run-once.ts --force | tee pipeline-result.json
          echo "used_http=false" >> "$GITHUB_OUTPUT"
          {
            echo "## Collect pipeline result"
            echo '```json'
            cat pipeline-result.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Collect via cron HTTP
        if: steps.pipeline.outputs.used_http == 'true'
        run: |
          token="${CRON_SECRET:-$ADMIN_API_KEY}"
          base="${SITE_URL:-https://www.brieflynewsstream.com}"
          if ! response=$(curl -fsS -X POST "$base/api/cron/collect" \
            -H "Authorization: Bearer $token" \
            -H "Content-Type: application/json" \
            --max-time 300); then
            echo "::error::HTTP collect against $base/api/cron/collect failed."
            exit 1
          fi
          echo "$response"
          {
            echo "## Collect HTTP result"
            echo '```json'
            echo "$response"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  translate:
    name: Translate after collect
    needs: collect
    runs-on: ubuntu-latest
    timeout-minutes: 120
    if: always() && needs.collect.result != 'cancelled'
    env:
      # Drain more aggressively after a full collect.
      TRANSLATE_MAX_PASSES: "40"
      TRANSLATE_BATCH_SIZE: "100"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/ci?schema=public
          DIRECT_URL: postgresql://postgres:postgres@127.0.0.1:5432/ci?schema=public
        run: npx prisma generate

      - name: Translate via scheduled job
        if: ${{ env.DATABASE_URL != '' }}
        run: |
          set -o pipefail
          if [ -z "$GOOGLE_API_KEY" ]; then
            echo "::warning::GOOGLE_API_KEY missing; translate job will not fill ar/en pairs."
          fi
          # Force-claim translate even if pre-heal left it interrupted.
          npx tsx src/worker/job-once.ts translate --force | tee translate-result.json
          {
            echo "## Translate after collect"
            echo '```json'
            cat translate-result.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Translate via HTTP
        if: ${{ env.DATABASE_URL == '' }}
        run: |
          token="${CRON_SECRET:-$ADMIN_API_KEY}"
          base="${SITE_URL:-https://www.brieflynewsstream.com}"
          curl -fsS -X POST "$base/api/cron/translate" \
            -H "Authorization: Bearer $token" \
            -H "Content-Type: application/json" \
            --max-time 300 | tee translate-result.json
          {
            echo "## Translate after collect (HTTP)"
            echo '```json'
            cat translate-result.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  confirm:
    name: Confirm fresh bilingual feed
    needs: [collect, translate]
    runs-on: ubuntu-latest
    timeout-minutes: 200
    if: always() && needs.collect.result != 'cancelled'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/ci?schema=public
          DIRECT_URL: postgresql://postgres:postgres@127.0.0.1:5432/ci?schema=public
        run: npx prisma generate

      - name: Confirm freshness + translation (repair if needed)
        if: ${{ env.DATABASE_URL != '' }}
        run: |
          set -o pipefail
          npx tsx scripts/ops-confirm-once.ts \
            --max-age-hours=8 \
            --max-pending-translate=150 \
            --repair | tee confirm-result.json
          {
            echo "## Confirm"
            echo '```json'
            cat confirm-result.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Smoke-check production health
        env:
          BASE_URL: ${{ secrets.SITE_URL || 'https://www.brieflynewsstream.com' }}
        run: |
          npx tsx scripts/smoke-bilingual.ts \
            || echo "::warning::Production smoke check reported problems; see the step log."
