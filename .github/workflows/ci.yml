name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Write test environment
        run: |
          mkdir -p prisma/data
          printf '%s\n' \
            'DATABASE_URL="file:./prisma/data/ci.db"' \
            'API_KEY="test-market-news-key"' \
            'ADMIN_API_KEY="test-admin-key"' \
            'CONSOLE_SESSION_SECRET="ci-console-session-secret-value"' \
            'APP_TIMEZONE="Asia/Kuwait"' \
            'NEXT_PUBLIC_APP_ENV="test"' \
            'GOOGLE_GROUNDED_SEARCH_ENABLED="false"' \
            'GOOGLE_EDITORIAL_ENABLED="false"' \
            > .env.test
      - run: npm run db:test
      - run: npm run seed:test
      - run: npm run test:e2e
        env:
          API_KEY: test-market-news-key
          ADMIN_API_KEY: test-admin-key
          CI: true
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

  smoke-production:
    if: ${{ vars.PRODUCTION_BASE_URL != '' }}
    runs-on: ubuntu-latest
    needs: [unit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run smoke
        env:
          BASE_URL: ${{ vars.PRODUCTION_BASE_URL }}
