name: Watchdog Arabic

# Soft-heal: clear zombie Arabic/collect locks and re-collect only when the
# Arabic desk is stale (≥5h) or the last job failed — never runs MAIN collect.
# Saves Neon egress vs adding more full scheduled collects.

on:
  workflow_dispatch:

concurrency:
  # Share with Collect Arabic so watchdog never steals a live desk lock
  group: collect-arabic-news
  cancel-in-progress: false

env:
  APP_TIMEZONE: Asia/Kuwait
  NEXT_PUBLIC_APP_ENV: live
  ARABIC_COLLECT_ENABLED: ${{ vars.ARABIC_COLLECT_ENABLED || 'true' }}
  ARABIC_COLLECT_FORCE: "true"
  ARABIC_COLLECT_CONCURRENCY: "2"
  ARABIC_COLLECT_BUDGET_MS: "900000"
  ARABIC_COLLECT_REFRESH_HOURS: "4"
  ARABIC_MAX_ARTICLES_PER_RUN: "2500"
  COLLECT_GNEWS_LIMIT: "5"
  NORMALIZE_BATCH_SIZE: "1000"
  NORMALIZE_PASSES: "4"
  ARCHIVE_HOT_RETENTION_DAYS: "3"
  ARCHIVE_RAW_RETENTION_DAYS: "1"
  ARCHIVE_ARTICLE_COUNT_CAP: "20000"
  ARCHIVE_RAW_COUNT_CAP: "25000"
  ARCHIVE_COUNT_CAP_MIN_AGE_HOURS: "36"
  DATABASE_URL: ${{ secrets.DATABASE_URL }}
  DIRECT_URL: ${{ secrets.DIRECT_URL }}
  ADMIN_API_KEY: ${{ secrets.ADMIN_API_KEY }}
  CRON_SECRET: ${{ secrets.CRON_SECRET }}
  SITE_URL: ${{ secrets.SITE_URL }}
  PRISMA_CONNECTION_LIMIT: "4"
  R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
  R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
  R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
  R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}

jobs:
  watchdog:
    name: Soft-heal Arabic freshness
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Egress gate (ARABIC_COLLECT_ENABLED)
        id: gate
        run: |
          flag="${ARABIC_COLLECT_ENABLED:-true}"
          echo "ARABIC_COLLECT_ENABLED=$flag"
          if [ "$flag" = "false" ] || [ "$flag" = "0" ] || [ "$flag" = "off" ]; then
            echo "::warning::Arabic watchdog paused (ARABIC_COLLECT_ENABLED=$flag)."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            {
              echo "## Arabic watchdog paused"
              echo "Set repo variable \`ARABIC_COLLECT_ENABLED=true\` to resume."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Check secrets
        if: steps.gate.outputs.enabled == 'true'
        run: |
          if [ -z "$DATABASE_URL" ] && [ -z "$CRON_SECRET" ] && [ -z "$ADMIN_API_KEY" ]; then
            echo "::error::Need DATABASE_URL (+ DIRECT_URL) or CRON_SECRET/ADMIN_API_KEY."
            exit 1
          fi

      - uses: actions/setup-node@v4
        if: steps.gate.outputs.enabled == 'true'
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        if: steps.gate.outputs.enabled == 'true'
        run: npm ci

      - name: Generate Prisma client
        if: steps.gate.outputs.enabled == 'true'
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/ci?schema=public
          DIRECT_URL: postgresql://postgres:postgres@127.0.0.1:5432/ci?schema=public
        run: npx prisma generate

      - name: Watchdog via database
        if: steps.gate.outputs.enabled == 'true' && env.DATABASE_URL != ''
        run: |
          set -o pipefail
          # Soft-heal: exit 0 when feed is fresh; only runs Arabic collect when stale.
          npx tsx src/worker/watchdog-arabic-once.ts --force | tee watchdog-arabic-result.json
          {
            echo "## Arabic freshness watchdog"
            echo '```json'
            cat watchdog-arabic-result.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Prune hot window (Neon Free backstop)
        if: steps.gate.outputs.enabled == 'true' && env.DATABASE_URL != ''
        run: |
          set -o pipefail
          npx tsx src/worker/archive-once.ts | tee watchdog-prune-result.json
          {
            echo "## Watchdog prune"
            echo '```json'
            cat watchdog-prune-result.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Watchdog via HTTP ops-heal (locks only)
        if: steps.gate.outputs.enabled == 'true' && env.DATABASE_URL == ''
        run: |
          token="${CRON_SECRET:-$ADMIN_API_KEY}"
          base="${SITE_URL:-https://www.brieflynewsstream.com}"
          # Without DATABASE_URL we can only clear locks via HTTP; full collect needs DB or collect-arabic workflow.
          curl -fsS -X POST "$base/api/cron/ops-heal" \
            -H "Authorization: Bearer $token" \
            -H "Content-Type: application/json" \
            --max-time 300 | tee watchdog-arabic-result.json
          {
            echo "## Arabic watchdog (HTTP ops-heal fallback)"
            echo "DATABASE_URL missing — cleared locks via ops-heal. Trigger **Collect Arabic news** manually if feed is still stale."
            echo '```json'
            cat watchdog-arabic-result.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Release Arabic lock if this run left it stuck
        if: always() && (failure() || cancelled()) && steps.gate.outputs.enabled == 'true' && env.DATABASE_URL != ''
        run: |
          npx tsx src/worker/release-lock-once.ts collect-arabic --force | tee release-lock-result.json || true
          {
            echo "## Lock cleanup"
            echo '```json'
            cat release-lock-result.json 2>/dev/null || echo '{"ok":false}'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
